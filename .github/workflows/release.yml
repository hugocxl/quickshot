name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quickshot-release
  cancel-in-progress: false

jobs:
  release:
    uses: hugocxl/stack/.github/workflows/reusable-release-macos.yml@main
    with:
      app-name: Quickshot
      timeout-minutes: 60
      artifact-paths: |
        build/release/Quickshot-${RELEASE_VERSION}-universal.zip
        build/release/Quickshot-${RELEASE_VERSION}-universal.zip.sha256
    secrets: inherit
