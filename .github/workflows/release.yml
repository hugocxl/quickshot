name: Release

# Every push to main publishes a stable release. Each pushed commit adds a
# version to CHANGELOG.md; the workflow tags every commit with its version and
# releases the newest one, with the changelog as its notes. Tags this workflow
# pushes don't start it again.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quickshot-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          # Local tags until validation passes; they're pushed before signing.
          scripts/changelog.sh tag "$BEFORE" "$GITHUB_SHA"
          VERSION="$(scripts/changelog.sh version)"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Use the Xcode the project is developed with
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          swift --version
      - name: Validate build, tests and app bundle
        run: scripts/validate.sh
      - name: Push the version tags
        # Every validated version keeps its tag even when signing or publishing
        # fails; a rerun finds the tags and only finishes the release.
        run: git push origin --tags
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_P12:?Developer ID certificate is required}"
          : "${CERTIFICATE_PASSWORD:?Certificate password is required}"
          umask 077
          CERTIFICATE="$RUNNER_TEMP/quickshot-release-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/quickshot-release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          trap 'rm -f "$CERTIFICATE"' EXIT
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security import "$CERTIFICATE" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application:/ {print $2; exit}')"
          : "${IDENTITY:?No Developer ID Application identity found}"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, staple and verify release
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REQUIRE_NOTARIZATION: '1'
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$APPLE_API_KEY_P8" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY_PATH"
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
          fi
          scripts/release.sh
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Publish complete assets through a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          # The changelog since the latest release, so a push of several
          # commits lists them all.
          PREVIOUS="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          scripts/changelog.sh notes "${PREVIOUS#v}" > "$RUNNER_TEMP/quickshot-release-notes.md"
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/quickshot-release.json"; then
            if [ "$(plutil -extract isDraft raw "$RUNNER_TEMP/quickshot-release.json")" != true ]; then
              echo 'Error: this release is already public; its assets are immutable' >&2
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --draft --latest=false --prerelease=false \
              --title "Quickshot $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/quickshot-release-notes.md"
          fi
          ASSETS=("build/release/Quickshot-$RELEASE_VERSION-universal.zip" "build/release/Quickshot-$RELEASE_VERSION-universal.zip.sha256")
          gh release upload "$TAG" --clobber "${ASSETS[@]}"
          for ASSET in "${ASSETS[@]}"; do
            NAME="$(basename "$ASSET")"
            REMOTE_SIZE="$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$NAME\") | .size")"
            test "$REMOTE_SIZE" = "$(stat -f %z "$ASSET")"
          done
          # Only a newer release becomes the latest; a patch to an older line
          # is published without moving it backwards.
          LATEST="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          NEWEST="$(printf '%s\n%s\n' "${LATEST#v}" "$RELEASE_VERSION" | sed '/^$/d' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          if [ "$NEWEST" = "$RELEASE_VERSION" ]; then LATEST_FLAG=--latest; else LATEST_FLAG=--latest=false; fi
          gh release edit "$TAG" --draft=false --prerelease=false "$LATEST_FLAG"
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-logs
          path: build/validation/*.log
          if-no-files-found: ignore
      - name: Remove signing keychain
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/quickshot-release-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH"; fi
          rm -f "$RUNNER_TEMP/quickshot-release-certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
